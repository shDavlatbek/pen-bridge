# Builds the phone app and the Windows program, then publishes a GitHub release.
# Runs when a version tag is pushed (e.g. `git push origin v0.2.0`), or by hand from the Actions tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Windows cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64
          rustup target add x86_64-pc-windows-gnu

      - name: Test PC program
        working-directory: desktop
        run: cargo test

      - name: Build PenBridge.exe
        working-directory: desktop
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Test and build phone app
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Collect files
        run: |
          VERSION="${TAG#v}"
          mkdir dist
          cp desktop/target/x86_64-pc-windows-gnu/release/PenBridge.exe dist/
          cp android/app/build/outputs/apk/release/app-release.apk "dist/PenBridge-${VERSION}.apk"
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            NOTES="docs/release-notes/${TAG}.md"
            if [ -f "$NOTES" ]; then NOTE_ARGS=(--notes-file "$NOTES"); else NOTE_ARGS=(--generate-notes); fi
            gh release create "$TAG" dist/* --title "PenBridge ${TAG#v}" --target "$GITHUB_SHA" "${NOTE_ARGS[@]}"
          fi
